<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FANBOL — Painel de CAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E13;
    --panel:#12181F;
    --panel-2:#161D26;
    --line:#232C36;
    --brand:#FF6A1F;
    --brand-dim:#8A3814;
    --turf:#2E9E6B;
    --turf-dim:#1B5C3E;
    --danger:#D9503C;
    --danger-dim:#5C2A22;
    --gold:#E8B33D;
    --text:#EDEFF2;
    --muted:#8A97A3;
    --muted-2:#5D6874;
    --display: 'Barlow Condensed', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 1200px 600px at 50% -10%, rgba(255,106,31,0.07), transparent),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    padding-bottom:80px;
  }
  ::selection{background:var(--brand-dim); color:#fff;}

  /* ---------- Yard-line ticker header ---------- */
  .yard-header{
    position:sticky; top:0; z-index:50;
    background:rgba(10,14,19,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .yard-ticker{
    display:flex; align-items:center; gap:0;
    height:6px;
    background-image:repeating-linear-gradient(90deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 40px);
    opacity:0.6;
  }
  .header-inner{
    max-width:1240px; margin:0 auto;
    padding:16px 24px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:0.5px;
    color:var(--text);
  }
  .brand .mark span{color:var(--brand);}
  .brand .sub{
    font-family:var(--mono); font-size:11px; color:var(--muted-2);
    letter-spacing:1.5px; text-transform:uppercase;
  }
  .header-right{display:flex; align-items:center; gap:10px;}
  .gm-badge{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:6px 10px;
    font-family:var(--mono); font-size:12px; color:var(--muted);
  }
  .gm-badge input{
    background:transparent; border:none; outline:none; color:var(--brand);
    font-family:var(--mono); font-size:12px; width:110px;
  }
  .nav-tabs{display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:10px; border:1px solid var(--line);}
  .nav-tab{
    font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:0.4px;
    color:var(--muted); background:transparent; border:none; cursor:pointer;
    padding:8px 16px; border-radius:7px; transition:all .15s ease;
  }
  .nav-tab.active{background:var(--brand); color:#fff;}
  .nav-tab:hover:not(.active){color:var(--text);}

  .sleeper-sync{
    display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; font-family:var(--mono); font-size:11px; color:var(--muted-2);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  .sleeper-sync:hover{color:var(--text); border-color:var(--brand);}
  .sleeper-sync.syncing{color:var(--brand);}

  .wrap{max-width:1240px; margin:0 auto; padding:28px 24px;}

  /* ---------- League overview scoreboard ---------- */
  .league-summary{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    margin-bottom:28px;
  }
  .sum-cell{background:var(--panel); padding:16px 20px;}
  .sum-cell .label{font-family:var(--mono); font-size:10.5px; letter-spacing:1.2px; color:var(--muted-2); text-transform:uppercase;}
  .sum-cell .value{font-family:var(--mono); font-size:22px; font-weight:600; margin-top:6px;}
  .sum-cell .value.turf{color:var(--turf);}
  .sum-cell .value.danger{color:var(--danger);}

  .section-title{
    font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:0.3px;
    display:flex; align-items:center; gap:10px; margin:26px 0 14px;
  }
  .section-title .rule{flex:1; height:1px; background:var(--line);}
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .sort-btn{
    font-family:var(--mono); font-size:11.5px; color:var(--muted); background:var(--panel);
    border:1px solid var(--line); border-radius:7px; padding:7px 12px; cursor:pointer;
    letter-spacing:0.5px;
  }
  .sort-btn.active{color:var(--brand); border-color:var(--brand);}

  .division-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(560px,1fr)); gap:16px;}
  .division-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;
  }
  .division-head{
    padding:10px 16px; background:var(--panel-2); border-bottom:1px solid var(--line);
    font-family:var(--display); font-weight:600; font-size:14px; letter-spacing:1.5px;
    color:var(--muted); text-transform:uppercase;
  }
  .team-row{
    display:grid; grid-template-columns:36px 1fr 110px 130px 60px;
    align-items:center; gap:10px; padding:10px 16px;
    border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s ease;
    border-left:3px solid transparent;
  }
  .team-row.over-cap{
    background:rgba(217,80,60,0.08);
    border-left:3px solid var(--danger);
  }
  .team-row.over-cap:hover{background:rgba(217,80,60,0.14);}
  .over-badge{
    display:inline-block; font-family:var(--mono); font-weight:600; font-size:9.5px; letter-spacing:0.8px;
    color:#fff; background:var(--danger); border-radius:4px; padding:2px 6px; margin-left:8px;
    vertical-align:middle;
  }
  .team-row:last-child{border-bottom:none;}
  .team-row:hover{background:var(--panel-2);}
  .team-sigla{
    font-family:var(--display); font-weight:800; font-size:16px;
    color:var(--text); background:#1a222b; border-radius:6px; text-align:center; padding:4px 0;
  }
  /* ---- logos / headshots ---- */
  .team-logo-wrap, .avatar-wrap{
    position:relative; border-radius:50%; overflow:hidden; background:#1a222b;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    border:1px solid var(--line);
  }
  .team-logo-fallback{
    font-family:var(--display); font-weight:800; color:var(--muted); letter-spacing:0.5px;
  }
  .team-logo-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:3px; }
  .avatar-fallback{ font-family:var(--mono); font-weight:600; font-size:11px; color:var(--muted); }
  .avatar-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center; }
  .player-cell{ display:flex; align-items:center; gap:10px; }
  .team-name-cell .fname{font-family:var(--display); font-weight:600; font-size:15px;}
  .team-name-cell .gm{font-family:var(--mono); font-size:10.5px; color:var(--muted-2);}
  .cap-hit-cell{font-family:var(--mono); font-size:13px; text-align:right; color:var(--muted);}
  .cap-space-cell{font-family:var(--mono); font-size:13px; text-align:right; font-weight:600;}
  .cap-space-cell.turf{color:var(--turf);}
  .cap-space-cell.danger{color:var(--danger);}
  .players-cell{font-family:var(--mono); font-size:12px; color:var(--muted-2); text-align:right;}

  /* ---------- Team detail ---------- */
  .team-header{
    display:flex; align-items:center; gap:18px; padding:20px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; margin-bottom:20px; flex-wrap:wrap;
  }
  .team-header.over-cap{
    border-color:var(--danger);
    background:linear-gradient(180deg, rgba(217,80,60,0.10), var(--panel) 70%);
  }
  .team-header .big-sigla{
    font-family:var(--display); font-weight:800; font-size:44px; background:#1a222b;
    border-radius:10px; padding:6px 18px; letter-spacing:1px;
  }
  .team-header .meta{flex:1; min-width:200px;}
  .team-header .meta .fname{font-family:var(--display); font-weight:700; font-size:24px;}
  .team-header .meta .gmline{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:2px;}
  .team-header .stats{display:flex; gap:22px; flex-wrap:wrap;}
  .team-header .stat .label{font-family:var(--mono); font-size:10px; color:var(--muted-2); letter-spacing:1px; text-transform:uppercase;}
  .team-header .stat .val{font-family:var(--mono); font-size:19px; font-weight:600; margin-top:3px;}
  .back-link{
    font-family:var(--mono); font-size:12px; color:var(--muted); cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; margin-bottom:14px;
  }
  .back-link:hover{color:var(--brand);}

  .cap-years{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px;}
  .year-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .year-card .yr{font-family:var(--mono); font-size:11px; color:var(--muted-2); letter-spacing:1px;}
  .year-bar-track{height:8px; background:#1a222b; border-radius:4px; margin:9px 0 7px; overflow:hidden; position:relative;}
  .year-bar-fill{height:100%; border-radius:4px; background:var(--turf); transition:width .4s ease;}
  .year-bar-fill.over{background:var(--danger);}
  .year-card .figures{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11.5px; color:var(--muted);}
  .year-card .figures b{color:var(--text); font-weight:600;}

  .roster-table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .roster-table thead th{
    text-align:left; font-family:var(--mono); font-size:10.5px; color:var(--muted-2);
    letter-spacing:1px; text-transform:uppercase; padding:10px 14px; background:var(--panel-2);
    border-bottom:1px solid var(--line);
  }
  .roster-table thead th.num{text-align:right;}
  .roster-table tbody td{padding:9px 14px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .roster-table tbody tr:last-child td{border-bottom:none;}
  .roster-table tbody tr:hover{background:var(--panel-2);}
  .pos-chip{
    font-family:var(--mono); font-weight:600; font-size:10.5px; padding:2px 7px; border-radius:5px;
    background:#1a222b; color:var(--gold); letter-spacing:0.5px;
  }
  .roster-table td.num{font-family:var(--mono); text-align:right; color:var(--muted);}
  .roster-table td.playername{font-weight:500;}
  .nfl-tag{font-family:var(--mono); font-size:11px; color:var(--muted-2);}

  /* ---------- Trade console ---------- */
  .trade-layout{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:flex-start;}
  @media(max-width:900px){.trade-layout{grid-template-columns:1fr;}}
  .search-box{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 14px; margin-bottom:14px;
  }
  .search-box input{
    flex:1; background:transparent; border:none; outline:none; color:var(--text);
    font-family:var(--body); font-size:14px;
  }
  .search-box input::placeholder{color:var(--muted-2);}
  .filter-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .chip{
    font-family:var(--mono); font-size:10.5px; padding:5px 10px; border-radius:20px;
    background:var(--panel); border:1px solid var(--line); color:var(--muted); cursor:pointer; letter-spacing:0.5px;
  }
  .chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .player-pick-list{max-height:520px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel);}
  .pick-row{
    display:grid; grid-template-columns:20px 30px 1fr auto auto; align-items:center; gap:10px;
    padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .pick-row:last-child{border-bottom:none;}
  .pick-row:hover{background:var(--panel-2);}
  .pick-row.added{background:rgba(46,158,107,0.08);}
  .pick-row .add-icon{
    width:20px; height:20px; border-radius:5px; border:1px solid var(--line); color:var(--muted-2);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-family:var(--mono);
  }
  .pick-row.added .add-icon{background:var(--brand); border-color:var(--brand); color:#fff;}
  .pick-row .pname{font-size:13.5px; font-weight:500;}
  .pick-row .pmeta{font-family:var(--mono); font-size:11px; color:var(--muted-2);}
  .pick-row .pteam{font-family:var(--display); font-weight:700; font-size:12px; color:var(--muted); background:#1a222b; padding:2px 7px; border-radius:5px;}
  .pick-row .psalary{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right; min-width:80px;}

  .cart-panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; position:sticky; top:100px;}
  .cart-panel h3{font-family:var(--display); font-weight:700; font-size:17px; margin-bottom:4px;}
  .cart-panel .hint{font-family:var(--mono); font-size:11px; color:var(--muted-2); margin-bottom:14px;}
  .cart-empty{
    text-align:center; padding:30px 10px; color:var(--muted-2); font-family:var(--mono); font-size:12px;
  }
  .cart-item{
    border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px; background:var(--panel-2);
  }
  .cart-item .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .cart-item .top .cname{font-size:13.5px; font-weight:600;}
  .cart-item .top .remove{color:var(--danger); cursor:pointer; font-family:var(--mono); font-size:11px;}
  .cart-item .flow{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; color:var(--muted-2);}
  .cart-item select{
    flex:1; background:#0e141a; border:1px solid var(--line); color:var(--gold); border-radius:6px;
    padding:6px 8px; font-family:var(--mono); font-size:12px; outline:none;
  }
  .cart-item .arrow{color:var(--brand);}

  .preview-title{font-family:var(--mono); font-size:10.5px; color:var(--muted-2); letter-spacing:1px; text-transform:uppercase; margin:16px 0 8px;}
  .preview-row{
    display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:12.5px;
  }
  .preview-row:last-child{border-bottom:none;}
  .preview-row .arrow-change{display:flex; align-items:center; gap:6px;}
  .preview-old{color:var(--muted-2);}
  .preview-new{font-weight:700;}
  .preview-new.turf{color:var(--turf);}
  .preview-new.danger{color:var(--danger);}

  .confirm-btn{
    width:100%; margin-top:16px; background:var(--brand); color:#fff; border:none; border-radius:9px;
    padding:13px; font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:0.5px;
    cursor:pointer; transition:all .15s ease;
  }
  .confirm-btn:hover{background:#E85A12;}
  .confirm-btn:disabled{background:var(--panel-2); color:var(--muted-2); cursor:not-allowed;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--brand); color:#fff; padding:12px 22px; border-radius:10px;
    font-family:var(--display); font-weight:600; font-size:15px; opacity:0; pointer-events:none;
    transition:all .3s ease; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .trade-log{margin-top:24px;}
  .log-entry{
    display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; margin-bottom:8px; font-size:12.5px;
    flex-wrap:wrap;
  }
  .log-entry .time{font-family:var(--mono); font-size:10.5px; color:var(--muted-2); min-width:120px;}
  .log-entry .who{font-family:var(--mono); font-size:11px; color:var(--gold);}

  .empty-state{text-align:center; padding:60px 20px; color:var(--muted-2); font-family:var(--mono); font-size:13px;}

  @media(max-width:640px){
    .league-summary{grid-template-columns:repeat(2,1fr);}
    .team-row{grid-template-columns:36px 1fr 90px; }
    .team-row .cap-space-cell, .team-row .players-cell{display:none;}
    .division-grid{grid-template-columns:1fr;}
    .cap-years{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="yard-header">
  <div class="yard-ticker"></div>
  <div class="header-inner">
    <div class="brand">
      <div class="mark">FAN<span>BOL</span></div>
      <div class="sub">Franchise CAP · 2025</div>
    </div>
    <div class="header-right">
      <div class="gm-badge">
        GM: <input id="gmNameInput" type="text" placeholder="seu nome">
      </div>
      <div class="nav-tabs">
        <button class="nav-tab active" data-view="league">Liga</button>
        <button class="nav-tab" data-view="trade">Trade</button>
      </div>
      <div class="sleeper-sync" id="sleeperSyncBadge" title="Sincroniza os times automaticamente com a liga no Sleeper (detecta trades feitas por lá)">🔄 Sleeper</div>
    </div>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="toast" id="toast"></div>

// ---------------- storage adapter ----------------
// Runs unchanged in two environments:
//  - Inside a Claude artifact: uses window.storage (shared = synced to every viewer of the artifact)
//  - Hosted standalone (e.g. GitHub Pages): uses Firebase Realtime Database for shared data,
//    and localStorage for personal (non-shared) data like your own display name.
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
const HAS_FIREBASE = (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined');
if (!HAS_CLAUDE_STORAGE && HAS_FIREBASE) {
  firebase.initializeApp(FIREBASE_CONFIG);
}

async function kvGet(key, shared) {
  if (HAS_CLAUDE_STORAGE) {
    try { return await window.storage.get(key, shared); } catch (e) { return null; }
  }
  if (!shared) {
    const v = localStorage.getItem('fanbol-local-' + key);
    return v !== null ? { value: v } : null;
  }
  if (!HAS_FIREBASE) { console.warn('Sem Firebase configurado — dados compartilhados não vão sincronizar.'); return null; }
  try {
    const snap = await firebase.database().ref('fanbolData/' + key).once('value');
    const v = snap.val();
    return v != null ? { value: v } : null;
  } catch (e) { console.error('firebase get failed', e); return null; }
}

async function kvSet(key, value, shared) {
  if (HAS_CLAUDE_STORAGE) {
    try { return await window.storage.set(key, value, shared); } catch (e) { return null; }
  }
  if (!shared) {
    localStorage.setItem('fanbol-local-' + key, value);
    return { value };
  }
  if (!HAS_FIREBASE) { console.warn('Sem Firebase configurado — dados compartilhados não vão sincronizar.'); return null; }
  try {
    await firebase.database().ref('fanbolData/' + key).set(value);
    return { value };
  } catch (e) { console.error('firebase set failed', e); return null; }
}

let tradeLog = [];
let view = 'league';
let selectedTeam = null;
let sortMode = 'confdiv'; // 'confdiv' | 'space_desc' | 'space_asc'
let cart = [];            // [{playerId, destTeam}]
let searchQuery = '';
let posFilter = 'ALL';

// ---------------- Sleeper enrichment (logos + headshots) ----------------
let sleeperIndex = {};   // normalizedName -> sleeper player_id
let sleeperReady = false;

function normalizeName(s) {
  return (s || '')
    .toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[.'’`]/g, '')
    .replace(/\b(JR|SR|II|III|IV|V)\b/g, '')
    .replace(/[^A-Z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// normalizedName -> array of same-name candidates, used to disambiguate
// players who share a name (e.g. two NFL "Byron Murphy"s) by position.
let sleeperByNamePos = {};

async function loadSleeperIndex() {
  try {
    const cached = await kvGet('fanbol-sleeper-idx-v4', true);
    if (cached && cached.value) {
      const parsed = JSON.parse(cached.value);
      sleeperIndex = parsed.idx;
      sleeperByNamePos = parsed.byNamePos;
      sleeperReady = true;
      return;
    }
  } catch (e) { /* no cache yet */ }
  try {
    const res = await fetch('https://api.sleeper.app/v1/players/nfl');
    if (!res.ok) throw new Error('bad status ' + res.status);
    const data = await res.json();
    const idx = {};
    const byNamePos = {};
    for (const pid in data) {
      const p = data[pid];
      if (!p || (!p.first_name && !p.last_name)) continue;
      const full = `${p.first_name || ''} ${p.last_name || ''}`.trim();
      const norm = normalizeName(full);
      if (!norm) continue;
      if (!idx[norm]) idx[norm] = { id: pid, espn_id: p.espn_id || null };
      (byNamePos[norm] = byNamePos[norm] || []).push({ id: pid, positions: p.fantasy_positions || (p.position ? [p.position] : []) });
    }
    sleeperIndex = idx;
    sleeperByNamePos = byNamePos;
    sleeperReady = true;
    try { await kvSet('fanbol-sleeper-idx-v4', JSON.stringify({ idx, byNamePos }), true); } catch (e) {}
  } catch (e) {
    console.warn('Sleeper player index unavailable, using fallback avatars', e);
  }
}

function sleeperIdFor(name) {
  return sleeperIndex[normalizeName(name)] || null;
}

// Same-name collisions (e.g. two NFL players called "Byron Murphy") must not
// silently pick one at random — only resolve when unambiguous, or when the
// position field breaks the tie; otherwise skip that player for sync.
function sleeperMatchFor(p) {
  const list = sleeperByNamePos[normalizeName(p.name)] || [];
  if (list.length === 1) return list[0];
  if (list.length > 1) {
    const byPos = list.filter(c => c.positions.includes(p.pos));
    if (byPos.length === 1) return byPos[0];
  }
  return null;
}

// ---------------- Sleeper league sync (auto-detect trades) ----------------
let sleeperLeagueSyncedAt = null;
let sleeperLeagueSyncing = false;

// Sleeper team_name comes with free-form suffixes ("Buffalo Bills - 8F"),
// so match by prefix against the canonical franchise name instead of exact equality.
function franchiseSiglaForTeamName(teamName) {
  const norm = (teamName || '').toUpperCase().replace(/\s+/g, ' ').trim();
  if (!norm) return null;
  for (const sigla of TEAM_ORDER) {
    const franquia = TEAMS_META[sigla].franquia;
    if (franquia && norm.startsWith(franquia)) return sigla;
  }
  return null;
}

function setSyncBadge(text, cls) {
  const badge = document.getElementById('sleeperSyncBadge');
  if (!badge) return;
  badge.textContent = text;
  badge.classList.toggle('syncing', !!cls);
}

async function syncSleeperLeague() {
  if (sleeperLeagueSyncing) return;
  sleeperLeagueSyncing = true;
  setSyncBadge('🔄 Sincronizando…', true);
  try {
    if (!sleeperReady) await loadSleeperIndex();

    const [usersRes, rostersRes] = await Promise.all([
      fetch(`https://api.sleeper.app/v1/league/${SLEEPER_LEAGUE_ID}/users`),
      fetch(`https://api.sleeper.app/v1/league/${SLEEPER_LEAGUE_ID}/rosters`)
    ]);
    if (!usersRes.ok || !rostersRes.ok) throw new Error('bad status');
    const users = await usersRes.json();
    const rosters = await rostersRes.json();

    const teamNameByOwner = {};
    users.forEach(u => { teamNameByOwner[u.user_id] = (u.metadata && u.metadata.team_name) || u.display_name || ''; });

    const pidToSigla = {};
    rosters.forEach(r => {
      const sigla = franchiseSiglaForTeamName(teamNameByOwner[r.owner_id]);
      if (!sigla || !Array.isArray(r.players)) return;
      r.players.forEach(pid => { pidToSigla[pid] = sigla; });
    });

    const changes = [];
    players.forEach(p => {
      const rec = sleeperMatchFor(p);
      if (!rec || !rec.id) return;
      const newSigla = pidToSigla[rec.id];
      if (newSigla && newSigla !== p.team) {
        changes.push({
          time: new Date().toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),
          by: 'Sleeper', player: p.name, from: p.team, to: newSigla
        });
        p.team = newSigla;
      }
    });

    if (changes.length) {
      await savePlayers();
      tradeLog = [...changes.reverse(), ...tradeLog];
      await saveTradeLog();
      showToast(`Sleeper sync — ${changes.length} jogador(es) atualizado(s) por trade`);
      render();
    }

    sleeperLeagueSyncedAt = new Date();
    setSyncBadge(`🔄 Sleeper · ${sleeperLeagueSyncedAt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}`, false);
  } catch (e) {
    console.warn('Sleeper league sync failed', e);
    setSyncBadge('🔄 Sleeper (falhou, clique p/ tentar de novo)', false);
  } finally {
    sleeperLeagueSyncing = false;
  }
}

function initials(name) {
  const parts = (name || '').trim().split(/\s+/);
  return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
}

// swap a broken <img> to a fallback URL once; if that also fails, hide it (fallback text shows through)
function handleImgFallback(img, nextSrc) {
  img.onerror = function () { img.style.display = 'none'; };
  img.src = nextSrc;
}

function playerAvatarHtml(p, size) {
  size = size || 32;
  const rec = sleeperIdFor(p.name);
  let img = '';
  if (rec && rec.id) {
    const espnFallback = rec.espn_id
      ? `handleImgFallback(this, 'https://a.espncdn.com/i/headshots/nfl/players/full/${rec.espn_id}.png')`
      : `this.style.display='none'`;
    img = `<img class="avatar-img" src="https://sleepercdn.com/content/nfl/players/${rec.id}.jpg" loading="lazy" onerror="${espnFallback}">`;
  }
  return `<div class="avatar-wrap" style="width:${size}px;height:${size}px;"><span class="avatar-fallback">${initials(p.name)}</span>${img}</div>`;
}

const ESPN_ABBR_OVERRIDE = { WAS: 'wsh' };
function teamLogoHtml(sigla, size) {
  size = size || 36;
  const espnAbbr = ESPN_ABBR_OVERRIDE[sigla] || sigla.toLowerCase();
  return `<div class="team-logo-wrap" style="width:${size}px;height:${size}px;">
    <span class="team-logo-fallback" style="font-size:${Math.round(size*0.34)}px;">${sigla}</span>
    <img class="team-logo-img" src="https://sleepercdn.com/images/team_logos/nfl/${sigla.toLowerCase()}.png" loading="lazy"
      onerror="handleImgFallback(this, 'https://a.espncdn.com/i/teamlogos/nfl/500/${espnAbbr}.png')">
  </div>`;
}

const fmt = (n) => {
  n = Number(n) || 0;
  const neg = n < 0;
  const v = Math.round(Math.abs(n)).toLocaleString('en-US');
  return (neg ? '-$' : '$') + v;
};
const fmtShort = (n) => {
  n = Number(n) || 0;
  return (n < 0 ? '-$' : '$') + (Math.abs(n)/1e6).toFixed(1) + 'M';
};

// ---------------- storage ----------------
async function loadPlayers() {
  try {
    const res = await kvGet('fanbol-players-v1', true);
    if (res && res.value) {
      players = JSON.parse(res.value);
      return;
    }
  } catch (e) { /* not found */ }
  players = SEED.players.map(p => ({...p}));
  await savePlayers();
}

async function savePlayers() {
  try {
    await kvSet('fanbol-players-v1', JSON.stringify(players), true);
  } catch (e) { console.error('save players failed', e); }
}

async function loadTradeLog() {
  try {
    const res = await kvGet('fanbol-tradelog-v1', true);
    if (res && res.value) { tradeLog = JSON.parse(res.value); return; }
  } catch (e) {}
  tradeLog = [];
}

async function saveTradeLog() {
  try {
    await kvSet('fanbol-tradelog-v1', JSON.stringify(tradeLog.slice(0,40)), true);
  } catch (e) { console.error('save log failed', e); }
}

function myName() {
  return localStorage_get('fanbol-my-name') || '';
}
// window.storage has no localStorage per rules; use in-memory + personal (non-shared) storage key instead
let myNameCache = '';
async function loadMyName() {
  try {
    const res = await kvGet('fanbol-my-name', false);
    if (res && res.value) myNameCache = res.value;
  } catch (e) {}
  const input = document.getElementById('gmNameInput');
  if (input) input.value = myNameCache;
}
async function saveMyName(v) {
  myNameCache = v;
  try { await kvSet('fanbol-my-name', v, false); } catch (e) {}
}
function localStorage_get(){ return myNameCache; }

// ---------------- computed helpers ----------------
function teamPlayers(sigla) {
  return players.filter(p => p.team === sigla);
}
function teamCapByYear(sigla) {
  const ps = teamPlayers(sigla);
  const years = ['s2026','s2027','s2028','s2029'];
  return years.map(y => ps.reduce((sum,p) => sum + (Number(p[y]) || 0), 0));
}
function teamCapSpaceByYear(sigla) {
  const hit = teamCapByYear(sigla);
  const cap = TEAMS_META[sigla].salary_cap;
  return hit.map((h,i) => (Number(cap[i])||0) - h);
}

// ---------------- toast ----------------
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

// ---------------- render root ----------------
function render() {
  const app = document.getElementById('app');
  if (view === 'league') app.innerHTML = renderLeague();
  else if (view === 'team') app.innerHTML = renderTeam(selectedTeam);
  else if (view === 'trade') app.innerHTML = renderTrade();
  attachHandlers();
}

// ---------------- LEAGUE VIEW ----------------
function renderLeague() {
  const totalHit = TEAM_ORDER.reduce((s,sig) => s + teamCapByYear(sig)[0], 0);
  const totalSpace = TEAM_ORDER.reduce((s,sig) => s + teamCapSpaceByYear(sig)[0], 0);
  const overCount = TEAM_ORDER.filter(sig => teamCapSpaceByYear(sig)[0] < 0).length;
  const totalPlayers = players.length;

  let teamsSorted = [...TEAM_ORDER];
  if (sortMode === 'space_desc') teamsSorted.sort((a,b) => teamCapSpaceByYear(b)[0] - teamCapSpaceByYear(a)[0]);
  else if (sortMode === 'space_asc') teamsSorted.sort((a,b) => teamCapSpaceByYear(a)[0] - teamCapSpaceByYear(b)[0]);

  let bodyHtml = '';
  if (sortMode === 'confdiv') {
    const divisions = {};
    teamsSorted.forEach(sig => {
      const div = TEAMS_META[sig].conf_div || 'OUTROS';
      (divisions[div] = divisions[div] || []).push(sig);
    });
    bodyHtml = `<div class="division-grid">` + Object.entries(divisions).map(([div, siglas]) => `
      <div class="division-card">
        <div class="division-head">${div}</div>
        ${siglas.map(sig => teamRowHtml(sig)).join('')}
      </div>`).join('') + `</div>`;
  } else {
    bodyHtml = `<div class="division-grid" style="grid-template-columns:1fr;"><div class="division-card">
      ${teamsSorted.map(sig => teamRowHtml(sig)).join('')}
    </div></div>`;
  }

  return `
    <div class="league-summary">
      <div class="sum-cell"><div class="label">Cap Total da Liga</div><div class="value">${fmtShort(totalHit)}</div></div>
      <div class="sum-cell"><div class="label">Espaço Livre Total</div><div class="value ${totalSpace>=0?'turf':'danger'}">${fmtShort(totalSpace)}</div></div>
      <div class="sum-cell"><div class="label">Times Acima do Teto</div><div class="value ${overCount>0?'danger':'turf'}">${overCount} / 32</div></div>
      <div class="sum-cell"><div class="label">Jogadores na Liga</div><div class="value">${totalPlayers}</div></div>
    </div>

    <div class="section-title">Franquias<div class="rule"></div></div>
    <div class="toolbar">
      <button class="sort-btn ${sortMode==='confdiv'?'active':''}" data-sort="confdiv">POR DIVISÃO</button>
      <button class="sort-btn ${sortMode==='space_desc'?'active':''}" data-sort="space_desc">MAIS ESPAÇO</button>
      <button class="sort-btn ${sortMode==='space_asc'?'active':''}" data-sort="space_asc">MENOS ESPAÇO</button>
    </div>
    ${bodyHtml}
  `;
}

function teamRowHtml(sig) {
  const meta = TEAMS_META[sig];
  const hit = teamCapByYear(sig)[0];
  const space = teamCapSpaceByYear(sig)[0];
  const count = teamPlayers(sig).length;
  const over = space < 0;
  return `
    <div class="team-row ${over?'over-cap':''}" data-team="${sig}">
      ${teamLogoHtml(sig, 36)}
      <div class="team-name-cell">
        <div class="fname">${meta.franquia} ${over?'<span class="over-badge">CAP ESTOURADO</span>':''}</div>
        <div class="gm">GM ${meta.gm || '—'}</div>
      </div>
      <div class="cap-hit-cell">${fmtShort(hit)}</div>
      <div class="cap-space-cell ${space>=0?'turf':'danger'}">${fmtShort(space)}</div>
      <div class="players-cell">${count}j</div>
    </div>
  `;
}

// ---------------- TEAM VIEW ----------------
function renderTeam(sig) {
  if (!sig || !TEAMS_META[sig]) return `<div class="empty-state">Time não encontrado.</div>`;
  const meta = TEAMS_META[sig];
  const hitByYear = teamCapByYear(sig);
  const spaceByYear = teamCapSpaceByYear(sig);
  const roster = teamPlayers(sig).sort((a,b) => (a.order||99) - (b.order||99) || a.pos.localeCompare(b.pos));

  const yearsHtml = meta.years.map((yr,i) => {
    const cap = Number(meta.salary_cap[i])||0;
    const hit = hitByYear[i];
    const pct = cap>0 ? Math.min(100, (hit/cap)*100) : 0;
    const over = hit > cap;
    return `
      <div class="year-card">
        <div class="yr">${yr}</div>
        <div class="year-bar-track"><div class="year-bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
        <div class="figures"><span>Hit <b>${fmtShort(hit)}</b></span><span>Teto <b>${fmtShort(cap)}</b></span></div>
      </div>`;
  }).join('');

  const rows = roster.map(p => `
    <tr>
      <td><span class="pos-chip">${p.pos||'—'}</span></td>
      <td class="playername"><div class="player-cell">${playerAvatarHtml(p, 28)}<span>${p.name}</span></div></td>
      <td><span class="nfl-tag">${p.nfl_team||'FA'}</span></td>
      <td class="num">${fmt(p.s2026)}</td>
      <td class="num">${p.s2027 ? fmt(p.s2027) : '—'}</td>
      <td class="num">${p.s2028 ? fmt(p.s2028) : '—'}</td>
      <td class="num">${p.s2029 ? fmt(p.s2029) : '—'}</td>
      <td class="num">${p.dead_cap ? fmt(p.dead_cap) : '—'}</td>
    </tr>
  `).join('');

  return `
    <div class="back-link" data-back="league">← Voltar para a liga</div>
    <div class="team-header ${spaceByYear[0]<0?'over-cap':''}">
      ${teamLogoHtml(sig, 68)}
      <div class="meta">
        <div class="fname">${meta.franquia} ${spaceByYear[0]<0?'<span class="over-badge">CAP ESTOURADO</span>':''}</div>
        <div class="gmline">GM ${meta.gm || '—'} · ${meta.conf_div || ''}</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">Cap Hit 2026</div><div class="val">${fmtShort(hitByYear[0])}</div></div>
        <div class="stat"><div class="label">Espaço 2026</div><div class="val" style="color:${spaceByYear[0]>=0?'var(--turf)':'var(--danger)'}">${fmtShort(spaceByYear[0])}</div></div>
        <div class="stat"><div class="label">Jogadores</div><div class="val">${roster.length}</div></div>
      </div>
    </div>

    <div class="cap-years">${yearsHtml}</div>

    <div class="section-title">Elenco<div class="rule"></div></div>
    <table class="roster-table">
      <thead><tr>
        <th>Pos</th><th>Jogador</th><th>Time NFL</th>
        <th class="num">2026</th><th class="num">2027</th><th class="num">2028</th><th class="num">2029</th><th class="num">Dead Cap</th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan="8" style="text-align:center;color:var(--muted-2);padding:24px;">Nenhum jogador neste elenco.</td></tr>`}</tbody>
    </table>
  `;
}

// ---------------- TRADE VIEW ----------------
function renderTrade() {
  const q = searchQuery.trim().toLowerCase();
  let list = players;
  if (q) list = list.filter(p => p.name.toLowerCase().includes(q) || (TEAMS_META[p.team]?.franquia||'').toLowerCase().includes(q));
  if (posFilter !== 'ALL') list = list.filter(p => p.pos === posFilter);
  list = list.slice(0, 150);

  const positions = ['ALL','QB','RB','WR','TE','K','DL','LB','DB'];

  const pickRows = list.map(p => {
    const inCart = cart.find(c => c.playerId === p.id);
    return `
      <div class="pick-row ${inCart?'added':''}" data-pick="${p.id}">
        <div class="add-icon">${inCart ? '✓' : '+'}</div>
        ${playerAvatarHtml(p, 30)}
        <div>
          <div class="pname">${p.name}</div>
          <div class="pmeta">${p.pos||'—'} · ${p.nfl_team||'FA'}</div>
        </div>
        <div class="pteam">${p.team}</div>
        <div class="psalary">${fmt(p.s2026)}</div>
      </div>`;
  }).join('') || `<div class="empty-state">Nenhum jogador encontrado.</div>`;

  const cartHtml = cart.length === 0
    ? `<div class="cart-empty">Adicione jogadores da lista<br>para montar a trade.</div>`
    : cart.map(c => {
        const p = players.find(pl => pl.id === c.playerId);
        const options = TEAM_ORDER.filter(s => s !== p.team)
          .map(s => `<option value="${s}" ${c.destTeam===s?'selected':''}>${s} — ${TEAMS_META[s].franquia} (GM ${TEAMS_META[s].gm||'—'})</option>`).join('');
        return `
        <div class="cart-item">
          <div class="top">
            <div class="cname">${p.name}</div>
            <div class="remove" data-remove="${p.id}">remover</div>
          </div>
          <div class="flow">
            <span class="pteam" style="background:#1a222b;padding:2px 7px;border-radius:5px;">${p.team}</span>
            <span class="arrow">→</span>
            <select data-dest="${p.id}">${options}</select>
          </div>
        </div>`;
      }).join('');

  // preview: affected teams cap space before/after
  const affected = {};
  cart.forEach(c => {
    const p = players.find(pl => pl.id === c.playerId);
    if (!p) return;
    affected[p.team] = true;
    if (c.destTeam) affected[c.destTeam] = true;
  });
  const affectedTeams = Object.keys(affected);

  const previewHtml = affectedTeams.length === 0 ? '' : `
    <div class="preview-title">Impacto no CAP (2026)</div>
    ${affectedTeams.map(sig => {
      const before = teamCapSpaceByYear(sig)[0];
      // simulate
      const simPlayers = players.map(p => ({...p}));
      cart.forEach(c => { if (c.destTeam) { const sp = simPlayers.find(sp=>sp.id===c.playerId); if (sp) sp.team = c.destTeam; } });
      const simTeamHit = simPlayers.filter(p=>p.team===sig).reduce((s,p)=>s+(Number(p.s2026)||0),0);
      const after = (Number(TEAMS_META[sig].salary_cap[0])||0) - simTeamHit;
      return `
        <div class="preview-row">
          <span>${sig}</span>
          <span class="arrow-change">
            <span class="preview-old">${fmtShort(before)}</span> →
            <span class="preview-new ${after>=0?'turf':'danger'}">${fmtShort(after)}</span>
          </span>
        </div>`;
    }).join('')}
  `;

  const readyToConfirm = cart.length > 0 && cart.every(c => c.destTeam);

  const logHtml = tradeLog.length === 0 ? '' : `
    <div class="section-title">Últimas trades<div class="rule"></div></div>
    <div class="trade-log">
      ${tradeLog.slice(0,10).map(t => `
        <div class="log-entry">
          <span class="time">${t.time}</span>
          <span class="who">${t.by || 'GM'}</span>
          <span>moveu <b>${t.player}</b> de <b>${t.from}</b> para <b>${t.to}</b></span>
        </div>`).join('')}
    </div>
  `;

  return `
    <div class="section-title">Console de Trade<div class="rule"></div></div>
    <div class="trade-layout">
      <div>
        <div class="search-box">
          <span>🔍</span>
          <input id="searchInput" type="text" placeholder="Buscar jogador ou time..." value="${searchQuery}">
        </div>
        <div class="filter-chips">
          ${positions.map(p => `<div class="chip ${posFilter===p?'active':''}" data-pos="${p}">${p}</div>`).join('')}
        </div>
        <div class="player-pick-list">${pickRows}</div>
      </div>
      <div class="cart-panel">
        <h3>Trade em montagem</h3>
        <div class="hint">${cart.length} jogador(es) selecionado(s)</div>
        ${cartHtml}
        ${previewHtml}
        <button class="confirm-btn" id="confirmBtn" ${readyToConfirm ? '' : 'disabled'}>Confirmar Trade</button>
      </div>
    </div>
    ${logHtml}
  `;
}

// ---------------- event handlers ----------------
function attachHandlers() {
  document.querySelectorAll('.team-row').forEach(el => {
    el.addEventListener('click', () => { selectedTeam = el.dataset.team; view = 'team'; syncTabs(); render(); window.scrollTo(0,0); });
  });
  document.querySelectorAll('.sort-btn').forEach(el => {
    el.addEventListener('click', () => { sortMode = el.dataset.sort; render(); });
  });
  document.querySelectorAll('[data-back]').forEach(el => {
    el.addEventListener('click', () => { view = 'league'; syncTabs(); render(); window.scrollTo(0,0); });
  });
  document.querySelectorAll('[data-pick]').forEach(el => {
    el.addEventListener('click', () => {
      const id = Number(el.dataset.pick);
      const idx = cart.findIndex(c => c.playerId === id);
      if (idx >= 0) cart.splice(idx,1);
      else {
        const p = players.find(pl => pl.id === id);
        const defaultDest = TEAM_ORDER.find(s => s !== p.team) || '';
        cart.push({ playerId:id, destTeam: defaultDest });
      }
      render();
    });
  });
  document.querySelectorAll('[data-remove]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(el.dataset.remove);
      cart = cart.filter(c => c.playerId !== id);
      render();
    });
  });
  document.querySelectorAll('[data-dest]').forEach(el => {
    el.addEventListener('change', () => {
      const id = Number(el.dataset.dest);
      const c = cart.find(c => c.playerId === id);
      if (c) c.destTeam = el.value;
      render();
    });
  });
  document.querySelectorAll('[data-pos]').forEach(el => {
    el.addEventListener('click', () => { posFilter = el.dataset.pos; render(); });
  });
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', () => { searchQuery = searchInput.value; render(); preserveFocus(searchInput); });
    searchInput.focus();
    searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
  }
  const confirmBtn = document.getElementById('confirmBtn');
  if (confirmBtn) confirmBtn.addEventListener('click', executeTrade);
}

function preserveFocus(el) {
  requestAnimationFrame(() => {
    const fresh = document.getElementById(el.id);
    if (fresh) { fresh.focus(); fresh.setSelectionRange(fresh.value.length, fresh.value.length); }
  });
}

async function executeTrade() {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Confirmando...';

  const entries = [];
  cart.forEach(c => {
    const p = players.find(pl => pl.id === c.playerId);
    if (!p || !c.destTeam) return;
    entries.push({
      time: new Date().toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),
      by: myNameCache || 'GM',
      player: p.name, from: p.team, to: c.destTeam
    });
    p.team = c.destTeam;
  });

  await savePlayers();
  tradeLog = [...entries.reverse(), ...tradeLog];
  await saveTradeLog();

  showToast(`Trade confirmada — ${entries.length} jogador(es) movido(s)`);
  cart = [];
  render();
}

function syncTabs() {
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view || (view==='team' && t.dataset.view==='league'));
  });
}

// ---------------- boot ----------------
async function boot() {
  document.getElementById('app').innerHTML = `<div class="empty-state">Carregando o painel da liga...</div>`;
  await Promise.all([loadPlayers(), loadTradeLog(), loadMyName()]);
  render();

  // fetch logos/headshots from Sleeper in the background, then re-render when ready
  loadSleeperIndex().then(() => { render(); syncSleeperLeague(); });

  document.querySelectorAll('.nav-tab').forEach(t => {
    t.addEventListener('click', () => { view = t.dataset.view; syncTabs(); render(); window.scrollTo(0,0); });
  });
  const gmInput = document.getElementById('gmNameInput');
  gmInput.addEventListener('change', () => saveMyName(gmInput.value.trim()));

  const syncBadge = document.getElementById('sleeperSyncBadge');
  if (syncBadge) syncBadge.addEventListener('click', () => syncSleeperLeague());
}
boot();

</script>
</body>
</html>
